name: SpawnGuard
version: '${project.version}'
main: com.spawnguard.SpawnGuardPlugin
api-version: '1.21'
softdepend: [WorldGuard]
description: Keeps hostile mobs out of the spawn safezone.
commands:
  spawnguard:
    description: SpawnGuard admin command
    usage: /spawnguard reload
    permission: spawnguard.admin
permissions:
  spawnguard.admin:
    description: Allows /spawnguard reload
    default: op
